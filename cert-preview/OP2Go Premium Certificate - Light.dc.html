<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;}
  a{color:#c9952d;text-decoration:none;}
  a:hover{color:#a87a1f;}
</style>
</helmet>

<div data-screen-label="Certificate (Light)" style="position:relative; width:1400px; height:990px; overflow:hidden; font-family:'Source Sans 3','Helvetica Neue',Arial,sans-serif; -webkit-font-smoothing:antialiased; background:radial-gradient(ellipse 82% 66% at 0% 100%, rgba(201,149,45,0.11) 0%, transparent 55%), radial-gradient(132% 102% at 50% 110%, #c6d4ec 0%, #e6edf7 44%, #ffffff 84%);">

  <!-- nested gold frames -->
  <div style="position:absolute; inset:20px; border:1px solid rgba(201,149,45,0.32); border-radius:28px; pointer-events:none;"></div>
  <div style="position:absolute; inset:44px; border:1.6px solid {{ accent }}; border-radius:20px; box-shadow:0 0 0 1px rgba(201,149,45,0.12), inset 0 0 70px rgba(42,68,125,0.05); pointer-events:none; z-index:2;"></div>

  <!-- full-width bottom band: dark at the base, fading gradually up into the light -->
  <div style="position:absolute; left:46px; right:46px; top:46px; bottom:46px; border-radius:18px; background:linear-gradient(25deg, #0a1330 0px, #0a1330 100px, rgba(10,19,48,0.85) 200px, rgba(10,19,48,0.45) 320px, rgba(10,19,48,0.14) 430px, rgba(10,19,48,0) 540px); z-index:1; pointer-events:none;"></div>

  <!-- ribbon + rosette medal, hanging from top frame, top-left -->
  <img src="cert-assets/21759c70-d708-488d-814a-e2275ce2c29c.svg" alt="Award ribbon" style="position:absolute; top:-34px; left:70px; width:232px; height:auto; z-index:3; pointer-events:none;">
  <img src="cert-assets/f2801e35-f0b5-4c30-a42d-982a2c8afc72.png" alt="" style="position:absolute; top:130px; left:132px; width:120px; height:120px; z-index:4; opacity:0.95; pointer-events:none;">

  <!-- OldPain2Go logo (white strapline) sitting on the dark bottom band -->
  <img src="cert-assets/op2go-logo-white-strapline.png" alt="Steven Blake's OldPain2Go — Chronic Pain Release Therapy" style="position:absolute; bottom:74px; left:74px; width:400px; height:auto; z-index:3; pointer-events:none;">

  <!-- CPD accreditation seal -->
  <img src="cert-assets/cpd-seal-2026-2027.png" alt="Accredited CPD Event — The CPD Standards Office, CPD Provider 41236, 2026-2027, www.cpdstandards.com" style="position:absolute; bottom:58px; right:82px; width:196px; height:auto; z-index:3; pointer-events:none;">

  <!-- JoyHope watermark (baked image, was a file-masked div that Chrome blocks over file://) -->
    <img src="cert-assets/watermark-joyhope-light.png" alt="" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:820px; height:820px; opacity:0.06; z-index:1; pointer-events:none;">

  <!-- content -->
  <div style="position:absolute; inset:44px; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:3% 5%;">

    <div style="font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; font-size:70px; line-height:1.1; color:#11214a; letter-spacing:0.14em; text-transform:uppercase; margin-top:4px; margin-bottom:4px;">Certificate</div>

    <div style="font-size:30px; font-weight:600; text-transform:uppercase; letter-spacing:0.32em; color:{{ accent }}; margin-bottom:20px;">Of Completion</div>

    <div style="font-weight:400; font-size:22px; letter-spacing:0.02em; color:#5b6784; margin-bottom:8px; white-space:nowrap;">This Certificate is Presented to</div>

    <div style="font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:700; font-size:58px; line-height:1.18; color:#11214a; margin-bottom:8px;">Your Name</div>

    <hr style="width:260px; height:2px; border:0; background:{{ dividerBg }}; margin:0 0 12px 0;">

    <div style="font-weight:400; font-size:23px; letter-spacing:0.02em; color:#5b6784; margin-bottom:8px; white-space:nowrap;">for Successfully Completing the</div>

    <div style="font-weight:700; font-size:41px; line-height:1.15; color:#11214a; white-space:nowrap; margin-bottom:14px;">OldPain2Go<span style="font-size:0.62em; vertical-align:super;">&reg;</span> Certified Practitioner Training</div>

    <div style="font-weight:400; font-size:21px; letter-spacing:0.02em; color:#5b6784; margin-bottom:20px; white-space:nowrap;">Certificate No: <span style="font-weight:700; color:#11214a;">0123456</span>&nbsp;&nbsp;&middot;&nbsp;&nbsp;Accredited: <span style="font-weight:700; color:#11214a;">CPD hours</span></div>

    <!-- signature / date stacked -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:34px;">

      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <img src="cert-assets/signature-navy.svg" alt="Trudy Blake signature" style="display:block; width:{{ sigWidthPx }}; height:auto; opacity:0.95;">
        <hr style="width:230px; height:1px; border:0; background:{{ dividerBg }}; margin:0;">
        <div style="font-weight:400; font-size:18px; letter-spacing:0.04em; color:#11214a;">Director of Certification</div>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:500; font-size:30px; line-height:1.2; color:#11214a;">13 June 2026</div>
        <hr style="width:230px; height:1px; border:0; background:{{ dividerBg }}; margin:0;">
        <div style="font-weight:400; font-size:18px; letter-spacing:0.04em; color:#11214a;">Date Awarded</div>
      </div>

    </div>

  </div>
</div>
</x-dc>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#eef2f9"/>
    <rect x="30" y="30" width="40" height="40" rx="6" fill="#11214a"/>
    <text x="50" y="56" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#c9952d" text-anchor="middle">OP</text>
  </svg>
</template>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1400, &quot;height&quot;: 990 },
  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#c9952d&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Style&quot;, &quot;options&quot;: [&quot;#c9952d&quot;, &quot;#d4a437&quot;, &quot;#e6bf6a&quot;, &quot;#a87a1f&quot;] },
  &quot;sigWidth&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 250, &quot;min&quot;: 180, &quot;max&quot;: 400, &quot;step&quot;: 2, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Signature&quot; },
  &quot;wmOpacity&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0.06, &quot;min&quot;: 0, &quot;max&quot;: 0.2, &quot;step&quot;: 0.01, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Style&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#c9952d';
    const soft = '#e6bf6a';
    const sigWidth = this.props.sigWidth ?? 250;
    const wmOpacity = this.props.wmOpacity ?? 0.06;
    return {
      accent,
      wmOpacity,
      sigWidthPx: sigWidth + 'px',
      dividerBg: `linear-gradient(90deg, rgba(201,149,45,0) 0%, ${accent} 20%, ${soft} 50%, ${accent} 80%, rgba(201,149,45,0) 100%)`
    };
  }
}
</script>
</body>
</html>
